<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>detached</title>
    <style>
      /* The window itself is transparent (set at creation, later work) — everything below the
         banner is the content hole, reported to the native layer via set_hole_rect so whatever
         the app composites there (a libghostty surface, a webview) lines up under it. */
      /* The ONE source for the opaque "ground" colour of this page — the backstop painted
         wherever nothing else does. Both rules that need it (`.hole` and `.divider`, below) read
         or derive from this single declaration rather than each carrying its own literal. */
      :root { --hole-ground: #0e1516; }
      /* A hole's corner = the WINDOW's own corner: Apple's CONTINUOUS curve (CALayer's
         `kCACornerCurveContinuous`, SwiftUI's `.continuous`) at 16pt, measured on macOS 26 off
         the window's own alpha mask — NOT a 16px circle. At a 1px ring the two are visibly
         different shapes: a circle of r leaves the edge r from the corner, the continuous curve
         at ~1.53r and it runs tighter at the diagonal, so a `border-radius` ring lifted off the
         window edge and left a wedge of ground outside itself (shipped, then fixed). WebKit has
         no `corner-shape`, so the curve is drawn as the three cubic Béziers per corner Apple
         draws (`--sq` below, via `clip-path: shape()`); this token is the RADIUS those scale
         from. Applied ONLY to a hole corner that IS a window corner, so the ring curves with the
         window there instead of running square into a corner the window has already rounded
         off — and stays square everywhere else (at a divider, under the banner), where a curve
         would open a notch of ground the window has not rounded. Which corners qualify is the
         per-hole rule below (setting `--c-bl`/`--c-br`). Mirrors warden's `--pane-radius` (its
         docked page), and the consumer's composited content must carry the concentric inner
         curve itself, on the same corners (warden: `SURFACE_CORNER_RADIUS` with the continuous
         corner curve + `apply_corner_mask`, which reads them off its own frame), or its square
         corners paint over the ring's curve; change the radius in both together. */
      :root { --hole-radius: 16px; }
      /* `--sq`: a rect outline whose corners are Apple continuous corners of radii `--sq-tl` /
         `--sq-tr` / `--sq-br` / `--sq-bl` (0 = square), for `clip-path: shape(var(--sq))`. The
         constants are the control points of the three cubic Béziers Apple draws per corner
         (dumped from SwiftUI's `RoundedRectangle(cornerRadius:style:.continuous).path(in:)`,
         normalised to the radius; the same construction CALayer renders for a consumer's
         continuous-cornered layer, so the two sides of the seam agree by construction): the
         curve leaves the edge 1.528665r from the corner and its Béziers run tangent through
         1.088490r / 0.868407r. A `var()` inside a custom property is resolved on the element
         that COMPUTES the property, so this is declared once on the selector list of every
         element that reads it — each gets the path at its OWN `--sq-*` — rather than on :root,
         where it would resolve once with no radii and be invalid everywhere. The ring
         (`.hole::before`, the OUTER outline at the hole's radii) and the ground cover
         (`.hole::after`, the INNER outline at the radii less the ring's 1px, on the padding box)
         are this one path at two sizes; the ring is whatever shows between them. Same block,
         same reasoning, as warden's `index.html` — the two must stay identical. */
      .hole, .hole::before, .hole::after { --sq:
        from 0 calc(1.528665 * var(--sq-tl)),
        curve to calc(0.074911 * var(--sq-tl)) calc(0.631494 * var(--sq-tl)) with 0 calc(1.088490 * var(--sq-tl)) / 0 calc(0.868407 * var(--sq-tl)),
        curve to calc(0.631494 * var(--sq-tl)) calc(0.074911 * var(--sq-tl)) with calc(0.169060 * var(--sq-tl)) calc(0.372824 * var(--sq-tl)) / calc(0.372824 * var(--sq-tl)) calc(0.169060 * var(--sq-tl)),
        curve to calc(1.528665 * var(--sq-tl)) 0 with calc(0.868407 * var(--sq-tl)) 0 / calc(1.088490 * var(--sq-tl)) 0,
        line to calc(100% - 1.528665 * var(--sq-tr)) 0,
        curve to calc(100% - 0.631494 * var(--sq-tr)) calc(0.074911 * var(--sq-tr)) with calc(100% - 1.088490 * var(--sq-tr)) 0 / calc(100% - 0.868407 * var(--sq-tr)) 0,
        curve to calc(100% - 0.074911 * var(--sq-tr)) calc(0.631494 * var(--sq-tr)) with calc(100% - 0.372824 * var(--sq-tr)) calc(0.169060 * var(--sq-tr)) / calc(100% - 0.169060 * var(--sq-tr)) calc(0.372824 * var(--sq-tr)),
        curve to 100% calc(1.528665 * var(--sq-tr)) with 100% calc(0.868407 * var(--sq-tr)) / 100% calc(1.088490 * var(--sq-tr)),
        line to 100% calc(100% - 1.528665 * var(--sq-br)),
        curve to calc(100% - 0.074911 * var(--sq-br)) calc(100% - 0.631494 * var(--sq-br)) with 100% calc(100% - 1.088490 * var(--sq-br)) / 100% calc(100% - 0.868407 * var(--sq-br)),
        curve to calc(100% - 0.631494 * var(--sq-br)) calc(100% - 0.074911 * var(--sq-br)) with calc(100% - 0.169060 * var(--sq-br)) calc(100% - 0.372824 * var(--sq-br)) / calc(100% - 0.372824 * var(--sq-br)) calc(100% - 0.169060 * var(--sq-br)),
        curve to calc(100% - 1.528665 * var(--sq-br)) 100% with calc(100% - 0.868407 * var(--sq-br)) 100% / calc(100% - 1.088490 * var(--sq-br)) 100%,
        line to calc(1.528665 * var(--sq-bl)) 100%,
        curve to calc(0.631494 * var(--sq-bl)) calc(100% - 0.074911 * var(--sq-bl)) with calc(1.088490 * var(--sq-bl)) 100% / calc(0.868407 * var(--sq-bl)) 100%,
        curve to calc(0.074911 * var(--sq-bl)) calc(100% - 0.631494 * var(--sq-bl)) with calc(0.372824 * var(--sq-bl)) calc(100% - 0.169060 * var(--sq-bl)) / calc(0.169060 * var(--sq-bl)) calc(100% - 0.372824 * var(--sq-bl)),
        curve to 0 calc(100% - 1.528665 * var(--sq-bl)) with 0 calc(100% - 0.868407 * var(--sq-bl)) / 0 calc(100% - 1.088490 * var(--sq-bl)),
        close; }
      /* The OUTER outline (ring, hole) is at the hole's own corner radii `--c-*` (0 when unset);
         the INNER outline (the ground cover on the padding box) is those less the ring's 1px,
         floored at 0 so a square corner stays square. */
      .hole, .hole::before { --sq-tl: var(--c-tl, 0px); --sq-tr: var(--c-tr, 0px);
        --sq-br: var(--c-br, 0px); --sq-bl: var(--c-bl, 0px); }
      .hole::after { --sq-tl: max(var(--c-tl, 0px) - 1px, 0px);
        --sq-tr: max(var(--c-tr, 0px) - 1px, 0px); --sq-br: max(var(--c-br, 0px) - 1px, 0px);
        --sq-bl: max(var(--c-bl, 0px) - 1px, 0px); }
      html, body { margin: 0; height: 100%; background: transparent; font-family: -apple-system,
        BlinkMacSystemFont, system-ui, sans-serif; color: #fff; }
      /* body is a flex column so #holes gets whatever height is left below #banner's own —
         never a restated `calc(100% - <banner height>)` literal that would silently drift the
         moment the banner's height changes. */
      body { display: flex; flex-direction: column; }
      /* The banner IS the origin window's accent colour — the same treatment chrome-core gives
         its `#cc-banner` (`this.banner.style.background = windowColour`), so a popped-out window
         reads as belonging to the window it came from. Neutral grey fallback (chrome-core's own
         `#cc-banner` default) when the payload carries no colour.
         `padding-left: 78px` clears the macOS traffic lights: the window uses an Overlay titlebar,
         so the three lights float over the banner's top-left, and 78px is where they end at
         standard metrics — the same inset chrome-core reserves as `--cc-lights-inset`. */
      #banner { position: relative; height: 2.25rem; box-sizing: border-box; display: flex;
        align-items: center; padding: 0 .9rem 0 78px; background: var(--accent, #6b7280);
        -webkit-user-select: none; }
      #title { font-size: .8rem; font-weight: 700; letter-spacing: .01em; overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap; }
      /* The content hole below the banner. One `.hole` when undivided; two plus a drag
         divider when the payload declares pane ratios. Each reports its OWN rect, so the
         app's native layer positions one surface per hole. */
      /* `#holes` paints the ground itself: a hole's window corners are rounded
         (`--hole-radius`), so the notch outside each is this container's own canvas. The
         window's own corner mask trims exactly that notch today, but the ground is on
         regardless — the same always-on-ground ruling as `.hole`, one box further out, so a
         corner that is rounded but not masked (a radius mismatch, a future edge) can never
         leak wallpaper. */
      #holes { flex: 1; display: flex; background: var(--hole-ground); }
      /* The GROUND is ALWAYS ON — never toggled. The window is transparent and whatever the app
         composites into a hole sits ABOVE this webview, so a hole not covered by a live surface
         would otherwise show the desktop wallpaper. Painting an opaque ground unconditionally
         makes "an uncovered hole" unrepresentable rather than a state the geometry has to get
         exactly right on every transient (a mid-drag reflow, a spawn race, content that has not
         painted its first frame yet). It is invisible whenever a surface actually covers the
         hole — occluded by the layer above it — and covering whenever one doesn't, by
         construction. This stays generic: it is hole styling, which is this page's own concern;
         it says nothing about what a consumer puts in a hole. */
      .hole { position: relative; background: var(--hole-ground); box-sizing: border-box;
        border: 1px solid transparent; }
      /* The ring (`::before`, the border box clipped to the OUTER continuous outline) and the
         ground cover (`::after`, the padding box clipped to the INNER one, painting above it in
         tree order — a `::before` precedes an `::after`): the ring is the strip left between
         them, and its corner is the window's own curve. The border itself stays transparent and
         exists only as the 1px layout inset `contentRect` reads — a CSS border can only curve as
         a circle (`border-radius`), and the window's corner is not one (see `--hole-radius`). No
         `overflow: hidden` on the hole: it would clip the ring's `::before` to the padding box.
         The cover is what a consumer's composited content covers when live, with the same inner
         curve; while nothing is composited it is the hole's opaque ground, as before. */
      .hole::before { content: ""; position: absolute; inset: -1px; pointer-events: none;
        background: transparent; clip-path: shape(var(--sq)); }
      .hole::after { content: ""; position: absolute; inset: 0; pointer-events: none;
        background: var(--hole-ground); clip-path: shape(var(--sq)); }
      /* WHICH corners round (see `--hole-radius`): the banner sits above `#holes`, so no hole's
         top corner is a window corner; the BOTTOM-LEFT of the first hole and the BOTTOM-RIGHT of
         the last are (a single undivided hole is both). Corners at a divider stay 0 (the `--c-*`
         fallback). */
      #holes .hole:first-child { --c-bl: var(--hole-radius); }
      #holes .hole:last-child { --c-br: var(--hole-radius); }
      /* Hole chrome that matches a consumer's DOCKED pane chrome — a popped-out tab must look
         and work exactly as it did docked. The 1px border is always present (transparent by
         default), so focusing never shifts layout: only its colour changes. `.focused` paints
         the ring and means nothing with a single hole, hence the `#holes.multi` gate.
         The ring sits OUTSIDE the reported content box (see contentRect), so whatever the
         consumer composites into the hole never paints over it, and the `.hole` ground paints
         under the border so the ring is never a transparent gap.

         The ring colour is the origin window's accent (`--accent`, set on the root from the
         payload) pushed to an "electric" register with relative colour syntax: the window's
         own HUE, saturation floored at 85 and lightness pinned at 62, so a dark navy window
         rings electric blue and a forest green rings neon green — the pane belongs to its
         window at a glance, and the ring still pops against the dark ground whatever the user
         picked. The neutral no-colour fallback (chrome-core's `NEUTRAL_COLOUR` slate, hue ≈220)
         resolves to an electric blue, so a colourless window gets a ring, not grey. Same
         formula, same reasoning, as warden's `.pane.focused` — the two rules must stay
         identical, the way the two dividers do.

         Ring ONLY — no `box-shadow` halo. The composited content covers the content box, so a
         glow could show nowhere but the 5px divider strip, where it bled across the gap and read
         as one thick coloured line at the divider (shipped, then pulled). The "electric" is the
         colour alone. */
      #holes.multi .hole.focused::before {
        background: hsl(from var(--accent, #6b7280) h calc(max(s, 85)) 62); }
      /* The divider is a 1px line inside a 5px grab strip: 2px of hole ground either side of
         the line, all OPAQUE. This column is its own box painted directly on the (transparent)
         webview canvas — it sits BETWEEN two content holes, not over either one's ground — so a
         translucent colour here blends straight through to the desktop wallpaper behind the
         window (the original rgba(255,255,255,.18) was 82% wallpaper). The strip's ground is
         `--hole-ground` (the holes' own colour, so the strip reads as part of the gap between
         two terminals, not a bar) and the line is #393f40, the exact composite of that
         translucent white over --hole-ground. The strip is wider than the line because a 1px
         target cannot be grabbed; the extra width is invisible by construction. No close
         control rides it — a hole is retired by its own content ending (the consumer's call),
         never from this page. (Same values, same reasoning, as warden's own `#pane-divider`.) */
      .divider { width: 5px; flex: 0 0 5px; cursor: col-resize;
        background: linear-gradient(to right, var(--hole-ground) 2px, #393f40 2px, #393f40 3px,
          var(--hole-ground) 3px); }
    </style>
  </head>
  <body>
    <div id="banner" data-tauri-drag-region>
      <span id="title"></span>
    </div>
    <div id="holes"></div>
    <script>
      const titleEl = document.getElementById('title');

      const payload = window.__SHELL_DETACH__
        ? JSON.parse(window.__SHELL_DETACH__)
        : { appName: '', title: '', colour: null };

      document.title = payload.title || payload.appName || '';
      titleEl.textContent = payload.title || '';
      // On the ROOT, not the banner: the banner paints it, and so does the focus ring on a
      // `.hole` (a sibling of the banner, which could never inherit a banner-scoped value).
      if (payload.colour) document.documentElement.style.setProperty('--accent', payload.colour);

      // Ratios come from the payload; absent/short means one undivided hole, which is the
      // pre-panes behaviour exactly — same single `set_hole_rect { rect }` call, no `pane`
      // key — so a consumer that declares no panes is unaffected by this file changing.
      // No cap here: how many panes is a consuming-app concept (warden's own type caps it at
      // 2), and shell-core must not learn what a "split" is — it lays out whatever ratios
      // arrive.
      const toRatios = (panes) => (Array.isArray(panes) && panes.length > 1 ? panes : [1]);

      const holesEl = document.getElementById('holes');
      // Mutated in place by layout() — every divider handler closes over THIS array, so a
      // relayout must not rebind it.
      const holeEls = [];

      // Local, non-persisted divider drag. Nothing stores this ratio: the detached window is
      // transient and its own label is not the origin tab's persistence key, so persisting
      // here would need a second key space for no gain.
      //
      // Wired per divider, closing over the boundary index `i` it sits at (between holeEls[i-1]
      // and holeEls[i]) — not a hardcoded pair — so this generalises to however many panes
      // arrive rather than assuming exactly two. Every element on this page gets its own class,
      // never a shared `id`: a duplicated id is invalid HTML, and `getElementById` is defined to
      // return only the first match, which would leave every divider past the first rendered
      // but inert.
      function wireDivider(el, i) {
        el.addEventListener('mousedown', (down) => {
          down.preventDefault();
          const left = holeEls[i - 1];
          const right = holeEls[i];
          const startX = down.clientX;
          // The dragged PAIR's own combined width, not the whole #holes width — so 1px of
          // mouse movement moves the boundary by 1px regardless of how many other panes are
          // laid out alongside it.
          const total = left.getBoundingClientRect().width + right.getBoundingClientRect().width;
          const leftFlex = parseFloat(left.style.flex) || 0.5;
          const rightFlex = parseFloat(right.style.flex) || 0.5;
          // Redistribute only the flex budget this pair already holds between the two of them —
          // every other pane's flex is untouched, so a drag never disturbs a boundary it wasn't
          // grabbed at.
          const pairFlex = leftFlex + rightFlex;
          const startShare = pairFlex > 0 ? leftFlex / pairFlex : 0.5;
          const onMove = (mv) => {
            const delta = (mv.clientX - startX) / Math.max(1, total);
            const nextShare = Math.min(0.9, Math.max(0.1, startShare + delta));
            left.style.flex = `${nextShare * pairFlex} 1 0`;
            right.style.flex = `${(1 - nextShare) * pairFlex} 1 0`;
            reportRect();
          };
          const onUp = () => {
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onUp);
          };
          window.addEventListener('mousemove', onMove);
          window.addEventListener('mouseup', onUp);
        });
      }

      // Lay the holes out from `ratios`, discarding whatever was there. Used once at load from
      // the payload and again for every `shell-detach:panes` event (`set_panes` on the Rust
      // side), so a consumer whose slice count changes while the window is up gets the same
      // layout it would have opened with — one undivided hole for a single ratio, which then
      // reports itself with no `pane` key exactly like a window that never had panes.
      //
      // With 2+ holes a drag divider sits between each adjacent pair — a resize handle only.
      // Nothing on this page retires a hole: a slice vanishes when the consumer's content in it
      // ends and the consumer calls `set_panes` with the survivors.
      // The first hole starts `.focused` (the consumers' own default), and `shell-detach:focus`
      // (`set_focused_hole`) moves it.
      function layout(ratios) {
        holesEl.replaceChildren();
        holeEls.length = 0;
        holesEl.classList.toggle('multi', ratios.length > 1);
        ratios.forEach((r, i) => {
          if (i > 0) {
            const d = document.createElement('div');
            d.className = 'divider';
            wireDivider(d, i);
            holesEl.appendChild(d);
          }
          const el = document.createElement('div');
          el.className = 'hole' + (i === 0 ? ' focused' : '');
          el.style.flex = `${r} 1 0`;
          holesEl.appendChild(el);
          holeEls.push(el);
        });
        reportRect();
      }

      // The CONTENT box, inset by the hole's computed border: what the consumer composites
      // into the hole is sized to exactly this, so it never covers the focus ring. Read the
      // actual border width rather than restating "1px" so this can't drift from the CSS.
      function contentRect(el) {
        const r = el.getBoundingClientRect();
        const cs = getComputedStyle(el);
        const bl = parseFloat(cs.borderLeftWidth) || 0;
        const bt = parseFloat(cs.borderTopWidth) || 0;
        const br = parseFloat(cs.borderRightWidth) || 0;
        const bb = parseFloat(cs.borderBottomWidth) || 0;
        return { x: r.x + bl, y: r.y + bt,
          width: Math.max(0, r.width - bl - br), height: Math.max(0, r.height - bt - bb) };
      }

      function reportRect() {
        if (!window.__TAURI__) return;
        holeEls.forEach((el, i) => {
          const rect = contentRect(el);
          // Single hole: omit `pane` entirely, so the invoked command shape is unchanged
          // for consumers that never split.
          const args = holeEls.length > 1 ? { rect, pane: i } : { rect };
          window.__TAURI__.core.invoke('set_hole_rect', args).catch((err) => {
            console.error('shell-detach: set_hole_rect failed', err);
          });
        });
      }

      layout(toRatios(payload.panes));
      window.addEventListener('resize', reportRect);

      // Runtime relayout (`set_panes`). `emit_to` reaches every webview, so the payload is
      // stamped with the target window's label and this page keeps only its own.
      if (window.__TAURI__ && window.__TAURI__.event) {
        window.__TAURI__.event.listen('shell-detach:panes', (e) => {
          const p = e.payload || {};
          if (p.label && payload.label && p.label !== payload.label) return;
          layout(toRatios(p.panes));
        });
        // Which hole is typing (`set_focused_hole`) — moves the accent ring. Same stamping.
        window.__TAURI__.event.listen('shell-detach:focus', (e) => {
          const p = e.payload || {};
          if (p.label && payload.label && p.label !== payload.label) return;
          holeEls.forEach((el, i) => el.classList.toggle('focused', i === p.pane));
        });
      }
    </script>
  </body>
</html>
