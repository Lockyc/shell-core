<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>detached</title>
    <style>
      /* The window itself is transparent (set at creation, later work) — everything below the
         banner is the content hole, reported to the native layer via set_hole_rect so whatever
         the app composites there (a libghostty surface, a webview) lines up under it. */
      html, body { margin: 0; height: 100%; background: transparent; font-family: -apple-system,
        BlinkMacSystemFont, system-ui, sans-serif; color: #fff; }
      /* body is a flex column so #holes gets whatever height is left below #banner's own —
         never a restated `calc(100% - <banner height>)` literal that would silently drift the
         moment the banner's height changes. */
      body { display: flex; flex-direction: column; }
      /* The banner IS the origin window's accent colour — the same treatment chrome-core gives
         its `#cc-banner` (`this.banner.style.background = windowColour`), so a popped-out window
         reads as belonging to the window it came from. Neutral grey fallback (chrome-core's own
         `#cc-banner` default) when the payload carries no colour.
         `padding-left: 78px` clears the macOS traffic lights: the window uses an Overlay titlebar,
         so the three lights float over the banner's top-left, and 78px is where they end at
         standard metrics — the same inset chrome-core reserves as `--cc-lights-inset`. */
      #banner { position: relative; height: 2.25rem; box-sizing: border-box; display: flex;
        align-items: center; padding: 0 .9rem 0 78px; background: var(--accent, #6b7280);
        -webkit-user-select: none; }
      #title { font-size: .8rem; font-weight: 700; letter-spacing: .01em; overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap; }
      /* The content hole below the banner. One `.hole` when undivided; two plus a drag
         divider when the payload declares pane ratios. Each reports its OWN rect, so the
         app's native layer positions one surface per hole. */
      #holes { flex: 1; display: flex; }
      .hole { background: transparent; }
      #divider { width: 6px; cursor: col-resize; background: rgba(255,255,255,.18); flex: 0 0 6px; }
    </style>
  </head>
  <body>
    <div id="banner" data-tauri-drag-region>
      <span id="title"></span>
    </div>
    <div id="holes"></div>
    <script>
      const banner = document.getElementById('banner');
      const titleEl = document.getElementById('title');

      const payload = window.__SHELL_DETACH__
        ? JSON.parse(window.__SHELL_DETACH__)
        : { appName: '', title: '', colour: null };

      document.title = payload.title || payload.appName || '';
      titleEl.textContent = payload.title || '';
      if (payload.colour) banner.style.setProperty('--accent', payload.colour);

      // Ratios come from the payload; absent/short means one undivided hole, which is the
      // pre-panes behaviour exactly — same single `set_hole_rect { rect }` call, no `pane`
      // key — so a consumer that declares no panes is unaffected by this file changing.
      // No cap here: how many panes is a consuming-app concept (warden's own type caps it at
      // 2), and shell-core must not learn what a "split" is — it lays out whatever ratios
      // arrive.
      const ratios = Array.isArray(payload.panes) && payload.panes.length > 1
        ? payload.panes
        : [1];

      const holesEl = document.getElementById('holes');
      const holeEls = [];
      ratios.forEach((r, i) => {
        if (i > 0) {
          const d = document.createElement('div');
          d.id = 'divider';
          holesEl.appendChild(d);
        }
        const el = document.createElement('div');
        el.className = 'hole';
        el.style.flex = `${r} 1 0`;
        holesEl.appendChild(el);
        holeEls.push(el);
      });

      function reportRect() {
        if (!window.__TAURI__) return;
        holeEls.forEach((el, i) => {
          const r = el.getBoundingClientRect();
          const rect = { x: r.x, y: r.y, width: r.width, height: r.height };
          // Single hole: omit `pane` entirely, so the invoked command shape is unchanged
          // for consumers that never split.
          const args = holeEls.length > 1 ? { rect, pane: i } : { rect };
          window.__TAURI__.core.invoke('set_hole_rect', args).catch((err) => {
            console.error('shell-detach: set_hole_rect failed', err);
          });
        });
      }

      // Local, non-persisted divider drag. Nothing stores this ratio: the detached window is
      // transient and its own label is not the origin tab's persistence key, so persisting
      // here would need a second key space for no gain.
      const divider = document.getElementById('divider');
      if (divider) {
        divider.addEventListener('mousedown', (down) => {
          down.preventDefault();
          const startX = down.clientX;
          const total = holesEl.getBoundingClientRect().width;
          const startFlex = parseFloat(holeEls[0].style.flex) || 0.5;
          const onMove = (mv) => {
            const delta = (mv.clientX - startX) / Math.max(1, total);
            const next = Math.min(0.9, Math.max(0.1, startFlex + delta));
            holeEls[0].style.flex = `${next} 1 0`;
            holeEls[1].style.flex = `${1 - next} 1 0`;
            reportRect();
          };
          const onUp = () => {
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onUp);
          };
          window.addEventListener('mousemove', onMove);
          window.addEventListener('mouseup', onUp);
        });
      }

      reportRect();
      window.addEventListener('resize', reportRect);
    </script>
  </body>
</html>
