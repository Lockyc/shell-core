name = "shell-core"
summary = "The shared Tauri app-shell + release tooling for a family of macOS Tauri apps"
status = "active"
tags = ["tauri", "release", "tooling", "shared-core", "macos"]

[[provides]]
name = "release-tooling"
summary = "The release, install and core-patch scripts as the source of truth, embedded and materialized into each consuming app: a one-command release (build + notarize, then tag, fast-forward main, push, publish with assets) and the shared-core [patch] dev/pin loop behind every app's <core>-dev / <core>-pin recipes. Every app-specific value comes from a tracked per-app scripts/tooling.env. Zero-dependency, so a build-dependency stays light."
[[provides]]
name = "app-shell"
summary = "The Tauri runtime sliver identical for any such app: register_plugins() (geometry, updater, process and edit-key plugins, plus the home, window-form, downloads-popup and detach protocols) and build_stamp() for the About box."
[[provides]]
name = "geometry"
summary = "geometry::{plugin, plugin_keyed, persist_as} — per-window size/position persistence in AppKit points, clamped to the target monitor's work area on restore and never recorded while fullscreen or minimized; keyed by a resolved config path, or by the app's own label → Persist mapping."
[[provides]]
name = "focus"
summary = "focus::{focused, unfocused, bring_forward} — SHELL_CORE_UNFOCUSED=1 launches an app that never activates, at launch, on a window build or on a bring-forward; its windows still open and paint."
[[provides]]
name = "windows"
summary = "windows — the window set an app's config declares: plan (pure labels, title-matched reconcile, menu entries), WindowSet (open/focus, close-keeps-listed, opt-in last-close quit, rename, delete, home surface) over the app's WindowHost, the New/Edit/Delete window form, and <scheme>://open?window=… URL parsing."
[[provides]]
name = "menu-spine"
summary = "menu::build_spine() — the App/Config/Window/Edit submenus (About, Check for Updates…, Edit/Reveal Config, a checked per-window selector, the clipboard items) identical across the family — menu::build_tab_menu() (the whole Tab submenu: ⌘⇧[/⌘⇧] cycling, the Cycle Tabs with ⌘1/⌘2 toggle, Close/Pop Out/Find, the app's own groups, ⌘1–9 jumps) and menu::route() (which window a command acts on, popped-out windows included). The family-standard accelerators are constants here."
[[provides]]
name = "home-surface"
summary = "home::{home_state, show_home, close_home} — the surface an app shows when it would otherwise have no window (no config / a load error / a valid config's window list), so the app is never stranded invisible. Never touches config-core itself — the consuming app wires the \"Create a starter config\" action, keeping the cores mutually independent."
[[provides]]
name = "detach-surface"
summary = "detach::{open_detached, wire_return, birth_hole, DetachSpec} — a popped-out tab's own window: the label scheme, the banner-shell page and its content hole (or the app's own page via DetachSpec::page), and the return-on-close hook the app redocks through."
[[provides]]
name = "web"
summary = "web — the content-webview layer for apps hosting remote sites in WKWebViews: content (create_content_webview / close_content_webview / close_window_pages, the one way a content webview is built or destroyed), escape (link routing and escape sentinels), session (WebKit login-store identity), insecure (allowlisted self-signed TLS), attachment (every Content-Disposition: attachment response saves), inspector, pointer and ipc_global."
[[provides]]
name = "downloads"
summary = "downloads — every content webview's downloads in one app-wide, newest-first list (downloads::list is the pure model) and the popup floating over the content that shows it (popup::toggle / popup::close); downloads::init hands the app its state changes."
[[provides]]
name = "banner"
summary = "banner::{init, fire, raise} — native macOS notifications through UNUserNotificationCenter, shown even while the app is frontmost; a click hands the app the banner's window, tab and context."
[[provides]]
name = "edit-keys"
summary = "edit_keys — undo, redo and select-all reach the focused web page first and the Edit menu only when the page leaves them, as in a browser."
[[provides]]
name = "compositing"
summary = "compositing::{HoleRect, CHROME_W, initial_hole, layout_webviews} — the hole-punch layout: the sidebar chrome is the window's main webview and Rust positions the content webviews in the hole it reports."
[[provides]]
name = "config-watch"
summary = "watch::watch_config — the config-file hot-reload watcher: a parent-directory watch matched by file name (atomic-save and FSEvents safe) that swallows the echo of its own format-on-save write."
[[provides]]
name = "mouse-nav"
summary = "mouse_nav — mouse side-button back/forward navigation for content webviews (WKWebView acts on neither), via a local NSEvent monitor driving the focused webview's history."
[[provides]]
name = "progress-bar"
summary = "progress_bar::install — a thin determinate loading bar pinned to the top of each content WKWebView, driven by WebKit's own progress signal, in the app's accent colour."
[[provides]]
name = "tab-unload-policy"
summary = "tabs::pick_live_neighbour — the one policy every tabbed app uses for which sibling becomes active after a tab unloads: the nearest loaded neighbour, else none."

